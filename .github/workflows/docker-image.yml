
name: Docker Image Build

on:
  push:
    branches:
      - develop
      - release
    paths:
      - Dockerfile
      - script.js
      - index.html
      - '!Jenkinsfile'
      - '!**/*.md'

  pull_request:
    types:
      - closed
      - synchronize
      - reopened

  workflow_dispatch:

jobs:
  build-image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t milky-macron-bakery:latest .

      - name: Save Docker image
        run: docker save -o my-image.tar milky-macron-bakery:latest

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: my-image.tar
          retention-days: 1

  push-image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-image
    runs-on: ubuntu-latest

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i my-image.tar

      - name: Tag Docker image
        run: |
          docker tag milky-macron-bakery:latest \
            "${{ secrets.DOCKERUSER }}/milky-macron-bakery:latest"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERUSER }}
          password: ${{ secrets.DOCKERAPI }}

      - name: Push Docker image
        run: |
          docker push "${{ secrets.DOCKERUSER }}/milky-macron-bakery:latest"
