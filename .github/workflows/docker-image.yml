name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build -t nitin-bakery .


  login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker login
        run: docker login -u ${{secrets.DOCKERUSER}} -p ${{secrets.DOCKERAPI}}

      - name: Tag docker image
        run: docker image tag nitin-bakery:latest ${{secrets.DOCKERUSER}}/nitin-bakery:latest

  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to Docker image to Dockerhub
        run: docker push ${{secrets.DOCKERUSER}}/nitin-bakery:latest
