
name: Docker Image Build and Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t milky-macron-bakery:latest .

      - name: Save the image
        run: docker save -o my-image.tar milky-macron-bakery:latest

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: my-image.tar
          retention-days: 1

  tag-image:
    if: github.event_name == 'push'
    needs: build-image
    runs-on: ubuntu-latest

    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load the image
        run: docker load -i my-image.tar

      - name: Tag the image
        env:
          DOCKERUSER: ${{ secrets.DOCKERUSER }}
        run: |
          docker image tag milky-macron-bakery:latest \
            "${DOCKERUSER}/milky-macron-bakery:latest"

      - name: Save tagged image
        env:
          DOCKERUSER: ${{ secrets.DOCKERUSER }}
        run: |
          docker save -o tag-image.tar \
            "${DOCKERUSER}/milky-macron-bakery:latest"

      - name: Upload tagged artifact
        uses: actions/upload-artifact@v4
        with:
          name: tag-image
          path: tag-image.tar
          retention-days: 1

  push-image:
    if: github.event_name == 'push'
    needs: tag-image
    runs-on: ubuntu-latest

    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: tag-image

      - name: Load the image
        run: docker load -i tag-image.tar

      - name: Login into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERUSER }}
          password: ${{ secrets.DOCKERAPI }}

      - name: Push to Docker Hub
        env:
          DOCKERUSER: ${{ secrets.DOCKERUSER }}
        run: |
          docker push \
            "${DOCKERUSER}/milky-macron-bakery:latest"

  run-container:
    if: github.event_name == 'push'
    needs: push-image
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERUSER }}
          password: ${{ secrets.DOCKERAPI }}

      - name: Pull Docker image
        env:
          DOCKERUSER: ${{ secrets.DOCKERUSER }}
        run: |
          docker pull \
            "${DOCKERUSER}/milky-macron-bakery:latest"

      - name: Run Docker container
        env:
          DOCKERUSER: ${{ secrets.DOCKERUSER }}
        run: |
          docker run -d \
            --name milky-macron-bakery \
            -p 8080:80 \
            "${DOCKERUSER}/milky-macron-bakery:latest"

      - name: Get Runner IP Address
        run: |
          echo "Runner hostname:"
          hostname

          echo "Runner private/network IP:"
          hostname -I || true

          echo "Runner public IP:"
          curl -s https://api.ipify.org
          echo

      - name: Allow Port 8080 on Runner
        run: |
          sudo ufw allow 8080/tcp || true

      - name: Verify Container and Port
        run: |
          echo "Container status:"
          docker ps

          echo "Application response:"
          curl --retry 5 --retry-connrefused \
            --retry-delay 2 http://localhost:8080

      - name: Infinite Loop
        run: |
          while true; do
            echo "GitHub Actions runner is active"
            echo "Container status:"
            docker ps --filter name=milky-macron-bakery
            sleep 30
          done
